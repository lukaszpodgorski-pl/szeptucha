name: "Legacy installer link"

# The download URL
#   https://github.com/lukaszpodgorski-pl/szeptucha/blob/main/szeptucha_1.0.0_x64-setup.exe
# was shared publicly before installers moved to GitHub Releases, so a real file has to
# stay at that exact path. A git symlink cannot stand in for it: GitHub serves committed
# symlinks as plain text, so such a URL would download the target path instead of the
# installer.
#
# This workflow keeps that file pointing at the newest published build. It runs on
# `release: published` rather than inside the build job on purpose - the legacy link must
# only ever serve an installer that was reviewed and actually released, never a draft.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to pin the legacy path to (e.g. v1.1.3)"
        required: true

permissions:
  contents: write

concurrency:
  group: legacy-installer-link
  cancel-in-progress: false

env:
  LEGACY_NAME: szeptucha_1.0.0_x64-setup.exe

jobs:
  refresh:
    # A pre-release must never become the default download behind the shared link.
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Download the Windows installer from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*_x64-setup.exe' --dir installer --clobber
          found=$(find installer -name '*_x64-setup.exe' | wc -l)
          if [ "$found" -ne 1 ]; then
            echo "::error::expected exactly one *_x64-setup.exe in $TAG, found $found"
            exit 1
          fi

      - name: Point the legacy path at it
        run: |
          mv installer/*_x64-setup.exe "$LEGACY_NAME"
          rmdir installer

      - name: Commit only if the binary actually changed
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LEGACY_NAME"
          if git diff --cached --quiet; then
            echo "Legacy installer already matches $TAG - nothing to commit."
            exit 0
          fi
          git commit -m "chore: point the legacy installer path at $TAG" \
            -m "Refreshed by the legacy-installer-link workflow so the URL shared before
          the move to GitHub Releases keeps serving the current build."
          git push origin HEAD:main
